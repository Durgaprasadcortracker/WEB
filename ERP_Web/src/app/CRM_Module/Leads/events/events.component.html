<form>
  <div class="form first">
    <div class="main-container">
      <div class="calendar">
        <div class="calendar-header">
          <button (click)="prevMonth()">&#10094;</button>
          <div>{{ months[currentMonth] }} {{ currentYear }}</div>
          <button (click)="nextMonth()">&#10095;</button>
        </div>
        <div class="calendar-body">
          <div class="calendar-weekday" *ngFor="let day of weekDays">{{ day }}</div>
          <div class="calendar-day"
               *ngFor="let day of calendarDays"
               [class.current]="day.isCurrent"
               [class.today]="day.isToday"
               (click)="selectDay(day)">
            <div class="date">{{ day.date }}</div>
            <div class="events">
              <div *ngFor="let event of day.events" class="event">
                <div class="event-title">{{ event.EventTitle }}</div>
                <button (click)="editEvent(event, $event)" class="material-symbols-outlined">Edit</button>
                <button (click)="deleteEvent(event, $event)" class="material-symbols-outlined">Delete</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div *ngIf="showModal" class="modal-background" (click)="closeModal()">
        <div class="modal-content" (click)="$event.stopPropagation()">
          <button class="close-button" (click)="closeModal()">&#10005;</button>
          <form (ngSubmit)="submitEvent()">
            <div class="form first">
              <h3>Events</h3>
              <hr />
              <div class="fields">
                <div class="input-field">
                  <label>Event Title</label>
                  <input type="text" class="form-control" [(ngModel)]="currentEvent.EventTitle" name="EventTitle" required>
                </div>
                <div class="input-field">
                  <label>Event time</label>
                  <input type="date" class="form-control" [(ngModel)]="currentEvent.EventTime" name="EventTime" required>
                </div>
                <div class="input-field">
                  <label>Add guests</label>
                  <select class="form-select" [(ngModel)]="currentEvent.EventQuests" name="EventQuests" required>
                    <option value="">Select guests</option>
                    <option *ngFor="let guest of guests" [value]="1">{{ guest }}</option>
                  </select>
                </div>
                <div class="input-field">
                  <label>Meeting Link</label>
                  <input type="text" class="form-control" [(ngModel)]="currentEvent.MeetingLink" name="MeetingLink">
                </div>
                <div class="input-field">
                  <label>Add Location</label>
                  <input type="text" class="form-control" [(ngModel)]="currentEvent.MeetingLocation" name="MeetingLocation">
                </div>
                <div class="emp-buttons">
                  <button type="submit" class="btn submit-btn btn-danger">Submit</button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</form>
