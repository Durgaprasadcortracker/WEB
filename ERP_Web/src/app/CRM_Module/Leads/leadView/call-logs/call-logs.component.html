<div class="form first">
    <div *ngIf="open==1" >
        <div>
            <div class="mr-2 d-flex justify-content-end" style="padding-bottom: 20px;">
                <button style="background-color: #8d0000;" type="button" routerLink="/CRM/Leads/leadView/{{id}}/callLogs/{{id}}" [queryParams]="{callsLogs:0}" class="btn btn-primary">Create Call Log</button>
            </div>
        </div>
            <table class="rwd-table table-bordered" style="width: 100%;">
                <thead>
                    <tr>
                        <th>Actions</th>
                        <th>S.No</th>
                        <th>Contact</th>
                        <th>Call Types </th>
                        <th>Date</th>
                        <th>Comments</th>
                   
                    </tr>
                </thead>
                <tbody>
                    <tr
                    *ngFor="let a of calllogsList | paginate: 
                    { itemsPerPage: tableSize, 
                    currentPage: page,
                    totalItems: count }; 
                    let i = index">
                        <td>
                            <span routerLink="/CRM/Leads/leadView/{{id}}/callLogs/{{id}}"  [queryParams]="{callsLogs:a.id}" (click)="edit(a.id)" class="btn btn-sm btn-outline-primary">
                                <i class="fa fa-pencil-alt"></i>
                            </span>
                            <span (click)="deleteCallLog(a.id)" class="btn btn-sm btn-outline-danger ml-4">
                                <i class="fa fa-trash"></i>
                            </span>
                        </td>
                        <td>{{i+1}}</td>
                        <td>{{a.firstName+''+a.lastName}}</td>
                        <td>{{a.callTypesDescription}}</td>
                        <td>{{a.callDate | date}}</td>
                        <td>{{a.comments}}</td>
                    </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-right mt-4" style="justify-content: end;">
                <pagination-controls previousLabel="Prev" nextLabel="Next" (pageChange)="onTableDataChange($event)">
                </pagination-controls>
            </div>
    </div>


    <div *ngIf="open==2">
        <form [formGroup]="myForm" (ngSubmit)="addCallLog()">
            <div class="">
                <div class="row" style="padding-top: 20px !important">
                <div class="col-md-4">
                    <label for="companyIndustry" class="form-label">Contact<span class="text-danger">*</span></label>
                    <div data-mdb-input-init class="form-outline">
                        <select type="text" class="form-select form-control-lg" formControlName="contactId"
                            [ngClass]="{ 'is-invalid': submitted && f['contactId'].errors }">
                            <option value="0">--Select Contact-- </option>
                            <option *ngFor="let a of contactsList" value="{{a.id}}">
                                {{a.firstName +" "+ a.lastName}}</option>
                        </select>
                        <div *ngIf="submitted && f['contactId'].errors" class="invalid-feedback">
                            <div *ngIf="f['contactId'].errors['required']">Contact is required.</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="callTypes" class="form-label">Call Types<span class="text-danger">*</span></label>
                    <div data-mdb-input-init class="form-outline">
                        <select type="text" class="form-select form-control-lg" formControlName="callTypes"
                            [ngClass]="{ 'is-invalid': submitted && f['callTypes'].errors }">
                            <option value="0">--Select Industry-- </option>
                            <option *ngFor="let a of calltypeslist" value="{{a.id}}">
                                {{a.description}}</option>
                        </select>
                        <div *ngIf="submitted && f['callTypes'].errors" class="invalid-feedback">
                            <div *ngIf="f['callTypes'].errors['required']">Call Types is required.</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="callDate" class="form-label">Call Date<span class="text-danger">*</span></label>
                    <div data-mdb-input-init class="form-outline">
                        <input type="date" class="form-control" formControlName="callDate" 
                        [ngClass]="{ 'is-invalid': submitted && f['callDate'].errors }">
                        <div *ngIf="submitted && f['callDate'].errors" class="invalid-feedback">
                            <div *ngIf="f['callDate'].errors['required']">Call Types is required.</div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
                <div class="d-flex flex-wrap">
                    <div class="row" style="padding-top: 20px;">
                    <div class="col-md-6">
                        <label>Comments <span class="required">*</span> </label>
                        <textarea class="form-control" cols="100" rows="3" formControlName="comments"
                            [ngClass]="{ 'is-invalid': submitted && f['comments'].errors }"></textarea>
                        <div *ngIf="submitted && f['comments'].errors" class="invalid-feedback">
                            <div *ngIf="f['comments'].errors['required']">Comments is required.</div>
                        </div>
                    </div>
                </div>
                </div>

            <div class="d-flex flex-wrap" style="padding-top: 20px;">
                <div class="col-md-6 mt-3 d-flex g-1">
                    <div class="mr-2">
                        <button type="submit" style="width: 200px;background-color: #8d0000;" class="btn btn-primary">Submit</button>
                    </div>
                    <div>
                        <div routerLink="/CRM/Leads/leadView/{{id}}/callLogs/{{id}}"  (click)="close()" style="width: 200px;" type="button" class="btn btn-dark">Close</div>
                    </div>
                </div>
            </div>
        </form>

    </div>
</div>
