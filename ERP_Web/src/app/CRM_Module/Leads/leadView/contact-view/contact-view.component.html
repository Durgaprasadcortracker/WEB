<div *ngIf="contactView">
    <div class="d-flex flex-wrap" style="box-sizing: border-box;">
      <div class="row col-md-12">
        <div class="col-md-2">
          <label style="font-weight: bold;">Name:</label>
        </div>
        <div class="col-md-4">
          <label>{{contactView.leadOwnerFirstName + " " + contactView.leadOwnerLastName}}</label>
        </div>
        <div class="col-md-2">
          <label style="font-weight: bold;">Email:</label>
        </div>
        <div class="col-md-4">
          <label>{{contactView.email}}</label>
        </div>
      </div>
      <div class="row col-md-12">
        <div class="col-md-2">
          <label style="font-weight: bold;">Phone Number:</label>
        </div>
        <div class="col-md-4">
          <label>{{contactView.phoneNumber}}</label>
        </div>
        <div class="col-md-2">
          <label style="font-weight: bold;">Company Name:</label>
        </div>
        <div class="col-md-4">
          <label>{{contactView.companyName}}</label>
        </div>
      </div>
      <div class="row col-md-12">
        <div class="col-md-2">
          <label style="font-weight: bold;">Company Owner:</label>
        </div>
        <div class="col-md-4">
          <label>{{contactView.companyOwner}}</label>
        </div>
      </div>
      <div class="row col-md-12" style="padding-top: 20px;">
        <div class="col-md-6">
          <label style="font-weight: bold;">Address1:</label>
          <label>{{contactView.address1}}</label>
        </div>
        <div class="col-md-6">
          <label style="font-weight: bold;">Address2:</label>
          <label>{{contactView.address2}}</label>
        </div>
      </div>
    </div>
  <hr/>
    <div class="row" style="padding-top: 20px;">
        <div class="col-md-4">
          <label for=""><strong>Stage</strong></label>
          <select class="form-control" name="leadStage" [(ngModel)]="contactView.leadStage">
            <option *ngFor="let a of allstages" [value]="a.id">{{a.description}}</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for=""><strong>Lead Status</strong></label>
          <select class="form-control" name="leadStatus" [(ngModel)]="contactView.leadStatus">
            <option *ngFor="let a of allstatus" [value]="a.id">{{a.description}}</option>
          </select>
        </div>
    </div>
  
    <div class="d-flex flex-wrap">
      <div class="col-md-6 mt-3 d-flex g-1">
        <div class="mr-2">
          <button type="button" (click)="update()" class="btn btn-primary" style="width: 200px; background: #900000;">Update</button>
        </div>
      </div>
    </div>
  </div>
