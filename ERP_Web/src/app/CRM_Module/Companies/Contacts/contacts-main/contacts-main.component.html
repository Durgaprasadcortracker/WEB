<div *ngIf="!contactPage " class="container mt-4">
    
            <div style="float: right;">
                <button routerLink="/CRM/Companies/add-contacts/{{id}}" [queryParams]="{companyid:id,'create':'add'}"   class="btn btn-danger" style="background-color: #8D0000;">Add Contacts</button>
              
            </div>
        </div>
      
    
        <div class="table-responsive mt-4" style="padding: 20px;">
            <table class="rwd-table table-bordered" style="width: 100%;">
                <thead>
                    <tr>
                        <th>Actions</th>
                        <th>Contact Name</th>
                        <th>Designation</th>
                        <th>Email</th>
                        <th>Phone Number</th>
                        <th>Company Name</th>
                        <th>Source</th>
                       
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let a of listOfContacts | paginate: 
                    { itemsPerPage: tableSize, 
                    currentPage: page,
                    totalItems: count }; 
                    let i = index">
                      <td>
                        <span  routerLink="/CRM/Companies/edit-contacts/{{id}}/{{a.id}}" [queryParams]="{id:a.id}" class="btn btn-sm btn-outline-primary">
                            <i class="fa fa-pencil-alt"></i>
                        </span>
                        <span (click)="deleteContact(a.id)" class="btn btn-sm btn-outline-danger ml-4">
                            <i class="fa fa-trash"></i>
                        </span>
                    </td>
            
                        <td>{{a.firstName+''+a.lastName}}</td>
                        <td>{{a.designation}}</td>
                        <td>{{a.email}}</td>
                        <td>{{a.mobileNumber}}</td>
                        <td>{{a.companyName}}</td>
                        <td>{{a.sourceName}}</td>
                      
                    </tr>
                </tbody>
            </table>
            <div class="pagination-container mt-4" style="justify-content: end;">
                <pagination-controls previousLabel="Prev" nextLabel="Next" (pageChange)="onTableDataChange($event)">
                </pagination-controls>
            </div>
        </div>
