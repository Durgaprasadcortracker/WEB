<section class="mt-3">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
          <div class="card-header bg-secondary text-white">
           <P class="h4">Create Sms</P>
          </div>
          <div class="card-body bg-light">
            <form (ngSubmit)="sendSms()">
              <div class="form-group">
                <label for="phoneNumber">Phone Number:</label>
                <input type="text" id="phoneNumber" FormControlName="phoneNumber" name="phoneNumber" class="form-control" required>
              </div>
              <div class="form-group mt-3">
                <label for="messageBody">Message Body:</label>
                <textarea id="messageBody" FormControlName="messageBody" name="messageBody" class="form-control" rows="4" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send SMS</button>
            </form>
            <div *ngIf="responseMessage" class="mt-3">
              <p>{{ responseMessage }}</p>
            </div>
          </div>
       </div>
    </div>
  </div>
</section>
