<section class="mt-3">
  <div class="container">
    <div class="row">
      <div class="col-6">
          <div class="card-header text-center text-white h5"  style="background-color: #8d0000;">
             Create SMS
          </div>
          <div class="card-body bg-light">
            <form (ngSubmit)="sendSms()">
              <div class="form-group h6">
                <label for="phoneNumber">Phone Number:</label>
                <input type="text" id="phoneNumber" FormControlName="phoneNumber" name="phoneNumber" class="form-control" required>
              </div>
              <div class="form-group mt-3 h6">
                <label for="messageBody">Message Body:</label>
                <textarea id="messageBody" FormControlName="messageBody" name="messageBody" class="form-control" rows="4" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary" style="background-color: #8d0000;">Send SMS</button>
            </form>
            <div *ngIf="responseMessage" class="mt-3">
              <p>{{ responseMessage }}</p>
            </div>
          </div>
       </div>
       <div class="col-6">
               <img style="width: 550px; height: 400px;" src="https://www.sender.net/wp-content/uploads/2023/07/b0179-sms-marketing-platforms-small-1024x658.webp">
       </div>
    </div>
  </div>
</section>
