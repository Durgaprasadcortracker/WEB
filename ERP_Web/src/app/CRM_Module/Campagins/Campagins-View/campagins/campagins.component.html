    <div style="padding: 20px;">
        <div class="" style="float:right; padding-bottom: 20px;">
        <button  class="btn btn-danger" routerLink="/CRM/Campagins/add-campagin" style="background-color: #8D0000;">Add Campaigns</button>
      </div>
        <table class="rwd-table table-bordered" style="width: 100%;">
            <thead>
                <tr>
                    <th>Actions</th>
                    <th>Campaign Name</th>
                    <th>Campaign Owner</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Start Date</th>
                    <th>End Date</th>

                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let a of listOfCampaigns  | paginate
                    : {
                        itemsPerPage: tableSize,
                        currentPage: page,
                        totalItems: count
                      };
                let i = index">
                    <td>
                        <span (click)="edit(campaign.id)" routerLink="/CRM/Campagins/editcampaign/{{a.id}}"
                            class="btn btn-sm btn-outline-primary">
                            <i class="fa fa-pencil-alt"></i>
                        </span>
                        <span (click)="deleteCampaign(a.id)" class="btn btn-sm btn-outline-danger ml-4">
                            <i class="fa fa-trash"></i>
                        </span>
                    </td>
                    <td>{{a.campaignName}}</td>
                    <td>{{a.campaignOwnerName}}</td>
                    <td>{{a.campaignType}}</td>
                    <td>{{a.campaignStatus}}</td>
                    <td>{{a.startDate}}</td>
                    <td>{{a.endDate}}</td>

                </tr>
            </tbody>
        </table>
        <div class="pagination-container mt-4" style="justify-content: end;">
            <pagination-controls previousLabel="Prev" nextLabel="Next" (pageChange)="onTableDataChange($event)">
            </pagination-controls>
          </div>
    </div>
