<div class="d-flex container">
  <div class="flex-grow-1">
    <div class="d-flex align-items-start mb-3" style="justify-content: center;">
      <div class="social-icons d-flex flex-wrap" style="gap: 10px">
        <div class="text-center">
          <input type="checkbox" value="whatsapp" (change)="toggleSelectwhatsapp($event)" multiple />
          <button class="btn btn-light btn-icon" (click)="sharePage('whatsapp')" data-bs-toggle="dropdown">
            <i class="fab fa-whatsapp fa-2x" style="color: #25d366"></i>
          </button>
        </div>
        <div class="text-center">
          <input type="checkbox" value="twitter" (change)="toggleSelecttwitter($event)" />
          <button class="btn btn-light btn-icon" (click)="sharePage('twitter')">
            <i class="fab fa-twitter fa-2x" style="color: #55acee"></i>
          </button>
        </div>
        <div class="text-center">
          <input type="checkbox" value="instagram" (change)="toggleSelectinstagram($event)" />
          <button class="btn btn-light btn-icon" (click)="sharePage('instagram')">
            <i class="fab fa-instagram fa-2x" style="color: #ac2bac"></i>
          </button>
        </div>
        <div class="text-center">
          <input type="checkbox" value="linkedin" (change)="toggleSelectlinkedin($event)" />
          <button class="btn btn-light btn-icon" (click)="sharePage('linkedin')">
            <i class="fab fa-linkedin-in fa-2x" style="color: #0082ca"></i>
          </button>
        </div>
        <div class="text-center">
          <input type="checkbox" value="facebook" (change)="toggleSelectfacebook($event)" />
          <button class="btn btn-light btn-icon" (click)="sharePage('facebook')">
            <i class="fab fa-facebook-f fa-2x" style="color: #3b5998"></i>
          </button>
        </div>
        <div class="text-center">
          <input type="checkbox" value="mail" (change)="toggleSelectmail($event)" />
          <button class="btn btn-light btn-icon" (click)="sharePage('mail')">
            <i class="fab fa-google fa-2x" style="color: #dd4b39"></i>
          </button>
        </div>
        <div class="text-center">
          <input type="checkbox" value="pinterest" (change)="toggleSelectpinterest($event)" />
          <button class="btn btn-light btn-icon" (click)="sharePage('pinterest')">
            <i class="fab fa-pinterest fa-2x" style="color: #c61118"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="form-group mb-3 h6" style="padding-top: 10px;">
      <label for="composeWithZia">Compose</label>
      <textarea class="form-control" id="composeWithZia" rows="5" placeholder="It's time to create your next best post."></textarea>
    </div>
    <div class="form-group mb-3 h6" style="padding-top: 10px;">
      <label for="fileUpload">Upload Image</label>
      <input type="file" class="form-control" id="fileUpload" />
    </div>
    <div class="mt-3">
      <button type="button" class="btn btn-primary m-2" style="background-color: #8d0000;" (click)="postNow()">Post Now</button>
    </div>
  </div>
  <div class="post-options p-3 border rounded ms-3">
    <h5>Publishing Options</h5>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="publishingOptions" id="publishNow" value="publishNow" />
      <label class="form-check-label" for="publishNow">Publish Now</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="publishingOptions" id="scheduleDate" value="scheduleDate" />
      <label class="form-check-label" for="scheduleDate">Schedule for a Specific Date</label>
    </div>
  </div>
</div>
