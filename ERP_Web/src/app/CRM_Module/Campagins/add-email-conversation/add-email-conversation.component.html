<div class="card m-2">
  <div class="card-header">
    New Email
  </div>
  <div class="card-body">
    <div class="container d-flex justify-content-center align-items-center vh-250">
      <div class="card w-50">
        <div class="card-header text-center">
          Compose Mail
        </div>
        <div class="card-body">
          <form  (ngSubmit)="onSubmit()">
            <!-- To -->
            <div class="mb-3">
              <label for="to" class="form-label">To</label>
              <input type="email" id="to" class="form-control" formControlName="to" placeholder="Enter recipient email">
              <div *ngIf="submitted && f['to'].errors" class="text-danger">
                Recipient email is required.
              </div>
            </div>

            <!-- Subject -->
            <div class="mb-3">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" id="subject" class="form-control" formControlName="subject" placeholder="Enter subject">
              <div *ngIf="submitted && f['subject'].errors" class="text-danger">
                Subject is required.
              </div>
            </div>

            <!-- Body -->
            <div class="mb-3">
              <label for="body" class="form-label">Body</label>
              <textarea id="body" class="form-control" formControlName="body" placeholder="Enter email body"></textarea>
              <div *ngIf="submitted && f['body'].errors" class="text-danger">
                Email body is required.
              </div>
            </div>

            <!-- Attachment -->
            <div class="mb-3">
              <label for="attachment" class="form-label">Attachment</label>
              <input type="file" id="attachment" class="form-control" formControlName="attachment">
            </div>

            <!-- Scheduled Time -->
            <div class="mb-3">
              <label for="scheduledTime" class="form-label">Scheduled Time</label>
              <!-- <div class="input-group">
                <input matInput [matDatepicker]="picker" id="scheduledTime" class="form-control" formControlName="scheduledTime">
                <button mat-icon-button matSuffix [for]="picker" (click)="picker.open()">
                  <mat-icon>schedule</mat-icon>
                </button>
                <mat-datepicker #picker></mat-datepicker>
              </div> -->
              <div *ngIf="submitted && f['scheduledTime'].errors" class="text-danger">
                Scheduled time is required.
              </div>
            </div>

            <!-- Send Button -->
            <div class="text-center">
              <button type="submit" class="btn btn-primary">Send</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
