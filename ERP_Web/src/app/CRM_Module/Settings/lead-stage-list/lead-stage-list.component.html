<div class="container-fluid mt-5">
  <div class="card">
    <div class="card-header h4">
      Stage
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-10"></div>
        <div class="col-md-2" style="padding-top: 20px;">
          <a class="btn  btn-outline-primary" routerLink="/CRM/Settings/leadstage"
            style="background-color: #8D0000;color: white; float: right;">Add Stage</a>
        </div>

      </div>
      <table class="rwd-table table-bordered mt-4" style="width: 100%;">
        <thead>
          <tr>
            <th scope="col" class="text-center" style="width: 20%;">Actions</th>
            <th scope="col" class="text-center" style="width: 40%;">S.No</th>
            <th scope="col" class="text-center" style="width: 40%;">Stage</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of stagelist | paginate
              : {
                  itemsPerPage: tableSize,
                  currentPage: page,
                  totalItems: count
                }; let i=index">
            <td>

              <button routerLink="/CRM/Settings/leadstage" [queryParams]="{stageid:s.id}"
                class="btn btn-sm btn-outline-primary">
                <i class="fa fa-pencil-alt"></i>
              </button>
              <button (click)="deleteStage(s.id)" class="btn btn-sm btn-outline-danger ml-2">
                <i class="fa fa-trash"></i>
              </button>
            </td>
            <td scope="row">{{i+1}}</td>
            <td>{{s.description}}</td>

          </tr>
        </tbody>
      </table>
      <div class="pagination-container" style="float: right;">
        <pagination-controls (pageChange)="onTableDataChange($event)"></pagination-controls>
      </div>
    </div>
  </div>
