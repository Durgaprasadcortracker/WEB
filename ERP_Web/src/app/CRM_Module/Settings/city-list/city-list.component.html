<div class="container-fluid mt-5">
    <div class="card">
      <div class="card-header">
        City
      </div>
      <div class="card-body">
        <div class="row" >
            <div class="col-md-10"></div>
            <div class="col-md-2">
                <a class="btn  btn-outline-primary" routerLink="/CRM/Settings/city" style="background-color: #8D0000;color: white;">Add City</a>
            </div>
          
        </div>
  
    <table class="rwd-table table-bordered mt-4" style="width: 100%;">
      <thead>
        <tr>
          <th scope="col">S.No</th>
          <th scope="col">Country</th>
          <th scope="col">State</th>
          <th scope="col">City</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of citylist| paginate
        : {
            itemsPerPage: tableSize,
            currentPage: page,
            totalItems: count
          }; let i=index">
          <td scope="row">{{ i + 1 }}</td>
          <td>{{ c.countryName }}</td>
          <td>{{ c.stateName }}</td>
          <td>{{ c.cityName }}</td>
          <td>
            <button routerLink="/CRM/Settings/edit-city/{{c.id}}" 
            class="btn btn-sm btn-outline-primary">
              <i class="fa fa-pencil-alt"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger ml-2" (click)="deleteCity(c.id)">
              <i class="fa fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="pagination-container">
        <pagination-controls (pageChange)="onTableDataChange($event)"></pagination-controls>
    </div>
</div>  
  </div>
