<div class="container-fluid mt-5">
  <div class="card">
    <div class="card-header h4">
      City
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-10"></div>
        <div class="col-md-2" style="padding-top: 20px;">
          <a class="btn  btn-outline-primary" routerLink="/CRM/Settings/city"
            style="background-color: #8D0000;color: white;float: right;">Add City</a>
        </div>
      </div>
      <table class="rwd-table table-bordered mt-4" style="width: 100%;">
        <thead>
          <tr>
            <th scope="col" class="text-center" style="width: 20%;">Actions</th>
            <th scope="col" class="text-center" style="width: 6%;">S.No</th>
            <th scope="col" class="text-center" style="width: 25%;">Country</th>
            <th scope="col" class="text-center" style="width: 25%;">State</th>
            <th scope="col" class="text-center" style="width: 24%;">City</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of citylist| paginate
        : {
            itemsPerPage: tableSize,
            currentPage: page,
            totalItems: count
          }; let i=index">
            <td class="text-center">
              <button routerLink="/CRM/Settings/edit-city/{{c.id}}" class="btn btn-sm btn-outline-primary">
                <i class="fa fa-pencil-alt"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger ml-2" (click)="deleteCity(c.id)">
                <i class="fa fa-trash"></i>
              </button>
            </td>
            <td scope="row" class="text-center">{{ i + 1 }}</td>
            <td class="text-center">{{ c.countryName }}</td>
            <td class="text-center">{{ c.stateName }}</td>
            <td class="text-center">{{ c.cityName }}</td>
          </tr>
        </tbody>
      </table>
      <div class="pagination-container" style="float: right;">
        <pagination-controls (pageChange)="onTableDataChange($event)"></pagination-controls>
      </div>
    </div>
  </div>
