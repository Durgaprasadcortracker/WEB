<div class="container-fluid mt-5">
    <div class="card">
      <div class="card-header h4">
        Time Zone
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-9"></div>
          <div class="col-md-3" style="padding-top: 20px;">
            <a class="btn btn-outline-primary" routerLink="/CRM/Settings/timezone" 
            style="background-color: #8D0000; color: white; float: right;">Add TimeZone</a>
          </div>
        </div>
        <table class="rwd-table table-bordered mt-4 text-center" style="width: 100%;">
          <thead>
            <tr>
              <th scope="col" class="text-center" style="width: 20%;">Actions</th>
              <th scope="col" class="text-center" style="width: 40%;">S.No</th>
              <th scope="col" class="text-center" style="width: 40%;">TimeZone</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let a of Timezonelist | paginate: 
            { itemsPerPage: tableSize, currentPage: page, totalItems: count }; let i = index">
                <td class="text-center">
                  <button routerLink="/CRM/Settings/timezone" [queryParams]="{ timezoneId: a.id }" class="btn btn-sm btn-outline-primary">
                    <i class="fa fa-pencil-alt"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger ml-2" (click)="deleteTimezone(a.id)">
                    <i class="fa fa-trash"></i>
                  </button>
                </td>
              <td scope="row" class="text-center">{{ i + 1 }}</td>
              <td class="text-center">{{ a.description }}</td>
            </tr>
          </tbody>
        </table>
        <div class="pagination-container" style="float: right;">
          <pagination-controls (pageChange)="onTableDataChange($event)"></pagination-controls>
        </div>
      </div>
    </div>
  </div>
