  <div class="container-fluid mt-5">
    <div class="card">
      <div class="card-header h4">
        Industry Type
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-9"></div>
          <div class="col-md-3" style="padding-top: 20px;">
            <a class="btn btn-outline-primary" routerLink="/CRM/Settings/industrytype" 
            style="float: right; background-color: #8D0000; color: white;">Add Industry Type</a>
          </div>
        </div>
        <table class="rwd-table table-bordered mt-4 text-center" style="width: 100%;">
          <thead>
            <tr>
              <th scope="col" class="text-center" style="width: 25%;">Actions</th>
              <th scope="col" class="text-center" style="width: 25%;">S.No</th>
              <th scope="col" class="text-center" style="width: 50%;">Industry Type</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let i of IndustrytypeList | paginate: { itemsPerPage: tableSize, currentPage: page }; let a = index">
              <td class="text-center">
                <div routerLink="/CRM/Settings/industrytype" [queryParams]="{industrytypeid: i.id}" 
                class="btn btn-sm btn-outline-primary">
                  <i class="fa fa-pencil-alt"></i>
                </div>
                <button class="btn btn-sm btn-outline-danger ml-2" (click)="deleteIndustrytype(i.id)">
                  <i class="fa fa-trash"></i>
                </button>
              </td>
              <td class="text-center" scope="row">{{ getSerialNumber(a) }}</td>
              <td class="text-center">{{ i.description }}</td>
            </tr>
          </tbody>
        </table>
        <div class="pagination-container" style="float: right;">
          <pagination-controls (pageChange)="onTableDataChange($event)"></pagination-controls>
        </div>
      </div>
    </div>
  </div>
