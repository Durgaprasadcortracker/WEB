<div class="container-fluid mt-5">
    <div class="card">
      <div class="card-header">
        <h3>Industry Type</h3>
      </div>
      <div class="card-body">
        <div class="row" >
            <div class="col-md-9"></div>
            <div class="col-md-3">
                <a class="btn  btn-outline-primary" routerLink="/CRM/Settings/industrytype" style="background-color: #8D0000;color: white;">Add Industry Type</a>
            </div>
          
        </div>
<table class="rwd-table mt-4" style="width: 100%;">
    <thead>
      <tr>
        <th scope="col">S.No</th>
        <th scope="col">Industry Type</th> 
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let i of IndustrytypeList; let a=index"> 
        <td scope="row">{{a+1}}</td>
        <td>{{i.description}}</td> 
        <td>
          <div routerLink="/CRM/Settings/industrytype" [queryParams]="{industrytypeid:i.id}" 
          class="btn btn-sm btn-outline-primary">
            <i class="fa fa-pencil-alt"></i>
        </div>
          <button class="btn btn-sm btn-outline-danger ml-2" (click)="deleteIndustrytype(i.id)">
            <i class="fa fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="pagination-container">
    <pagination-controls (pageChange)="onTableDataChange($event)"></pagination-controls>
</div>
  </div>
