<div class="container-fluid">
  <div class="card">
    <div class="card-header">
      Industry Type
    </div>
    <div class="card-body">

      <form [formGroup]="industrytypeForm" (ngSubmit)="submitForm()">
        <div class="form-group">
          <label for="description">Description</label>
          <div data-mdb-input-init class="form-outline">
            <input type="text" class="form-control" id="description" formControlName="description"
              placeholder="Enter description" [ngClass]="{ 'is-invalid': submitted && f['description'].errors }" />
            <div *ngIf="submitted && f['description'].errors" class="invalid-feedback">
              <div *ngIf="f['description'].errors['required']">Description is required.</div>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="button" class="btn btn-secondary ml-2" (click)="clear()">Close</button>
      </form>
    </div>
  </div>

  <table class="table mt-4">
    <thead>
      <tr>
        <th scope="col">S.No</th>
        <th scope="col">Industry Type</th> 
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let i of IndustrytypeList; let a=index"> 
        <th scope="row">{{a+1}}</th>
        <td>{{i.description}}</td> 
        <td>
          <button routerLink="/CRM/Settings/industry-type" [queryParams]="{industrytypeid:i.id}" 
          class="btn btn-sm btn-outline-primary">
            <i class="fa fa-pencil-alt"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger ml-2" (click)="deleteIndustrytype(i.id)">
            <i class="fa fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
